<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Notepad — a modern, private browser-based writing workspace." />
  <title>Notepad — Modern Writing Workspace</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="app-toolbar">
    <div class="toolbar-left">
      <button class="brand-btn" id="menuBtn" title="Notepad">
        <span class="brand-mark" aria-hidden="true">
          <span class="brand-mark-line line-one"></span>
          <span class="brand-mark-line line-two"></span>
          <span class="brand-mark-dot"></span>
        </span>
        <span class="brand-copy">
          <span class="brand-title">Notepad</span>
          <span class="brand-subtitle">Your writing space</span>
        </span>
      </button>
      <div class="toolbar-divider"></div>

      <button class="icon-btn" id="clearBtn" title="Clear note" aria-label="Clear note"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M7 7l1 13h8l1-13"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg></button>
      <button class="icon-btn" id="exportBtn" title="Download note" aria-label="Download note"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v11"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path><path d="M8 20v-2"></path><path d="M16 20v-2"></path></svg></button>
      <button class="icon-btn" id="copyBtn" title="Copy note" aria-label="Copy note"><svg class="icon" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg></button>
      <button class="icon-btn" id="historyBtn" title="Version history" aria-label="Version history"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6"></path><path d="M12 7v5l3 2"></path></svg></button>
      <button class="icon-btn" id="themeBtn" title="Switch to dark mode" aria-label="Switch to dark mode"><svg class="icon theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg></button>
      <button class="icon-btn" id="timerBtn" title="Start / stop timer" aria-label="Start or stop timer"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 3h6"></path><path d="M12 3v-1"></path></svg></button>
      <button class="icon-btn" id="shareBtn" title="Share note" aria-label="Share note"><svg class="icon" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="m8.3 10.8 7.4-4.2"></path><path d="m8.3 13.2 7.4 4.2"></path></svg></button>
    </div>

    <div class="toolbar-right">
      <div class="save-state"><span class="save-dot"></span><span>Saved locally</span></div>
      <button class="icon-btn" id="previewBtn" title="Read mode" aria-label="Read mode"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M9 4v16"></path><path d="M13 8h5"></path><path d="M13 12h5"></path><path d="M13 16h3"></path></svg></button>
      <button class="icon-btn" id="focusBtn" title="Focus mode — distraction-free" aria-label="Focus mode — distraction-free"><svg class="icon focus-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path></svg></button>
      <button class="icon-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen"><svg class="icon" viewBox="0 0 24 24"><path d="M8 3H3v5"></path><path d="M16 3h5v5"></path><path d="M8 21H3v-5"></path><path d="M16 21h5v-5"></path></svg></button>
      <button class="about-btn" id="aboutBtn">About</button>
    </div>
  </header>

  <div class="workspace-bar">
    <div class="workspace-context"><span class="workspace-label">Workspace</span><span class="workspace-name">Quick note</span></div>
    <div class="workspace-hint"><span class="shortcut-key">Ctrl</span><span>+</span><span class="shortcut-key">S</span><span>to save a version</span></div>
  </div>

  <main class="editor-shell">
    <section class="editor-frame">
      <div class="paper-header"><span class="paper-label">NOTE</span><span class="paper-line"></span></div>
      <div class="floating-tools" aria-label="Formatting tools">
    <button class="mini-btn" id="fontDownBtn" title="Smaller text">A−</button>
    <button class="mini-btn" id="fontUpBtn" title="Bigger text">A+</button>
    <span class="format-divider"></span>
    <button class="mini-btn" id="boldBtn" title="Bold"><strong>B</strong></button>
    <button class="mini-btn" id="italicBtn" title="Italic"><em>I</em></button>
    <button class="mini-btn heading-tool" id="headingBtn" title="Heading">H</button>
  </div>
      <div id="note" contenteditable="true" spellcheck="true" data-placeholder="Start writing something great..."></div>
      <div id="preview"></div>
      <div class="editor-footer">
        <span>Private · stored in your browser</span>
        <div class="footer-status">
          <span class="pill timer-pill" id="timer">00:00</span>
          <span class="pill stats-pill" id="stats">0 characters, 0 words</span>
        </div>
      </div>
    </section>
  </main>

  <div class="history-overlay" id="historyOverlay"></div>
  <aside class="history-panel" id="historyPanel">
    <div class="history-header">
      <div><span class="eyebrow">WORKSPACE</span><h2>Version History</h2><p>Save, restore, or delete previous versions.</p></div>
      <button class="history-close-btn" id="closeHistoryBtn" title="Close">×</button>
    </div>
    <button class="save-version-btn" id="saveVersionBtn"><span>+</span> Save Current Version</button>
    <div class="history-list" id="historyList"></div>
  </aside>

  <div id="toastContainer" class="toast-container"></div>
  <button id="exitFocusBtn" class="exit-focus-btn">Exit Focus</button>
</body>
</html>
